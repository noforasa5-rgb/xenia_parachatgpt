name: Build Prey 2006 Xbox 360 Aim Assist

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-prey-aimassist.yml'
      - 'prey_aimassist/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Download official Human Head PREY SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = @(
            'https://duke4ever.altervista.org/prey/files/PREY_SDK_2006-10-13.zip',
            'https://ftp.zx.net.nz/pub/mirror/ftp.3drealms.com/source/PREY_SDK_2006-10-13.zip'
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Trying $url"
              Invoke-WebRequest -Uri $url -OutFile PREY_SDK_2006-10-13.zip -TimeoutSec 120
              if ((Get-Item PREY_SDK_2006-10-13.zip).Length -gt 3000000) {
                $downloaded = $true
                break
              }
            } catch {
              Write-Warning $_
            }
          }
          if (-not $downloaded) { throw 'Could not download the official PREY SDK from any mirror.' }
          Get-FileHash PREY_SDK_2006-10-13.zip -Algorithm MD5
          Get-FileHash PREY_SDK_2006-10-13.zip -Algorithm SHA256
          Expand-Archive PREY_SDK_2006-10-13.zip -DestinationPath prey-official -Force

      - name: Normalize official SDK source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $weapon = Get-ChildItem prey-official -Filter prey_weaponfirecontroller.cpp -Recurse | Select-Object -First 1
          if (-not $weapon) { throw 'prey_weaponfirecontroller.cpp not found in official SDK.' }
          $preyDir = Split-Path $weapon.FullName -Parent
          $srcRoot = Split-Path $preyDir -Parent
          Write-Host "Official SDK source root: $srcRoot"

          New-Item -ItemType Directory -Force -Path prey-sdk/src | Out-Null
          Copy-Item "$srcRoot\*" prey-sdk/src -Recurse -Force

          $projects = Get-ChildItem prey-sdk/src -Filter *.vcproj -Recurse
          $gameProj = $projects | Where-Object { Select-String -Path $_.FullName -Pattern 'prey_weaponfirecontroller.cpp' -Quiet } | Select-Object -First 1
          $idProj = $projects | Where-Object { Select-String -Path $_.FullName -Pattern 'Base64.cpp' -Quiet } | Select-Object -First 1
          if (-not $gameProj) { throw 'Could not identify the official game vcproj.' }
          if (-not $idProj) { throw 'Could not identify the official idLib vcproj.' }
          Write-Host "Game project: $($gameProj.FullName)"
          Write-Host "idLib project: $($idProj.FullName)"
          Copy-Item $gameProj.FullName prey-sdk/src/2005game.vcproj -Force
          Copy-Item $idProj.FullName prey-sdk/src/2005idlib.vcproj -Force

          $def = Get-ChildItem prey-sdk/src -Filter game.def -Recurse | Select-Object -First 1
          if (-not $def) { throw 'game.def not found in official SDK.' }
          New-Item -ItemType Directory -Force -Path prey-sdk/src/game | Out-Null
          if ($def.FullName -ne (Resolve-Path prey-sdk/src/game -ErrorAction SilentlyContinue).Path + '\game.def') {
            Copy-Item $def.FullName prey-sdk/src/game/game.def -Force
          }

          Get-ChildItem prey-sdk/src -Depth 2 | Select-Object -First 100 FullName

      - name: Apply Xbox 360 aim-assist diagnostic port
        shell: pwsh
        run: |
          python prey_aimassist/patch_aimassist.py
          Select-String -Path prey-sdk/src/Prey/prey_weaponfirecontroller.cpp -Pattern 'ui_aimAssist|AA_MinDist|HH_FindXbox360AimAssistTarget|360 AimAssist'

      - name: Generate modern Win32 build files from original VS2005 projects
        shell: pwsh
        run: |
          python prey_aimassist/gen_cmake.py

      - name: Configure Win32 Release
        shell: pwsh
        run: |
          cmake -S prey-sdk/src -B prey-build -A Win32

      - name: Build retail-compatible gamex86.dll
        shell: pwsh
        run: |
          cmake --build prey-build --config Release --target gamex86 -- /m

      - name: Inspect and package diagnostic DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path prey-build -Filter gamex86.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'gamex86.dll was not produced' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact/gamex86.dll
          $hash = (Get-FileHash artifact/gamex86.dll -Algorithm SHA256).Hash.ToLower()
          "SHA-256  gamex86.dll`r`n$hash" | Set-Content artifact/SHA256.txt
          @"
          PREY 2006 - Xbox 360 Aim Assist - DIAGNOSTIC BUILD

          Target: retail PREY.exe 1.4 (Win32)
          Base source: official Human Head PREY SDK, 13 Oct 2006
          Game DLL: gamex86.dll

          Reconstructed Xbox 360 defaults:
            ui_aimAssist = 1
            AA_MinDist   = 90
            AA_MaxDist   = 680
            AA_MinDot    = 0.98
            AA_Width     = 75

          Diagnostic logging is enabled by default:
            AA_Debug = 1

          When a shot receives aim assistance the console prints:
            [360 AimAssist] target='...' dist=... dot=... width=...

          Keep a backup of the original game DLL/PK4 before testing.
          This is a first diagnostic build intended to verify loading and target selection.
          "@ | Set-Content artifact/README_TEST.txt

          "DLL: $($dll.FullName)"
          "SHA256: $hash"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Where-Object { $_.FullName -match '\\Hostx64\\x86\\dumpbin.exe$' } | Select-Object -First 1
          if ($dumpbin) {
            & $dumpbin.FullName /headers artifact/gamex86.dll | Out-File artifact/PE_HEADERS.txt
            & $dumpbin.FullName /exports artifact/gamex86.dll | Out-File artifact/EXPORTS.txt
            & $dumpbin.FullName /dependents artifact/gamex86.dll | Out-File artifact/DEPENDENTS.txt
          }

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: prey-360-aimassist-diagnostic
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
