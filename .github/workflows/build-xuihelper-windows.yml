name: Build XUIHelper CLI Windows

on:
  push:
    branches: [achievement-xui-runtime-poc2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v6
        with:
          repository: SGCSam/XUIHelper
          ref: c0d083036c6b0e3cdec5a3df0abfca0e58973117
          path: XUIHelper
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows x64 CLI
        shell: pwsh
        run: |
          dotnet publish XUIHelper/XUIHelper.CLI/XUIHelper.CLI.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o publish

      - name: Copy dashboard 17559 extension schemas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/Assets/Extensions/17559 | Out-Null
          Copy-Item XUIHelper/XUIHelper.Core/Assets/Extensions/V8/XuiElements.xml publish/Assets/Extensions/17559/
          Copy-Item XUIHelper/XUIHelper.Core/Assets/Extensions/V8/XuiDataBinding.xml publish/Assets/Extensions/17559/
          Copy-Item XUIHelper/XUIHelper.Core/Assets/Extensions/V8/XamElements.xml publish/Assets/Extensions/17559/
          Copy-Item XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559CustomElements.xml publish/Assets/Extensions/17559/
          Copy-Item XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559SceneElements.xml publish/Assets/Extensions/17559/
          Copy-Item XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559ControlPackElements.xml publish/Assets/Extensions/17559/
          Copy-Item XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559HUDElements.xml publish/Assets/Extensions/17559/
          Copy-Item XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559.xhe publish/Assets/Extensions/17559/

      - name: Smoke test
        shell: pwsh
        run: .\publish\XUIHelper.CLI.exe about

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: xuihelper-windows-x64-17559
          path: publish/**
          if-no-files-found: error
