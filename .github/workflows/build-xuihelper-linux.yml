name: Build XUIHelper CLI Linux

on:
  push:
    branches: [achievement-xui-runtime-poc2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v6
        with:
          repository: SGCSam/XUIHelper
          ref: c0d083036c6b0e3cdec5a3df0abfca0e58973117
          path: XUIHelper
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Linux x64 CLI
        shell: bash
        run: |
          dotnet publish XUIHelper/XUIHelper.CLI/XUIHelper.CLI.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=false \
            -o publish

      - name: Copy dashboard 17559 extension schemas
        shell: bash
        run: |
          mkdir -p publish/Extensions/17559
          cp XUIHelper/XUIHelper.Core/Assets/Extensions/V8/XuiElements.xml publish/Extensions/17559/
          cp XUIHelper/XUIHelper.Core/Assets/Extensions/V8/XuiDataBinding.xml publish/Extensions/17559/
          cp XUIHelper/XUIHelper.Core/Assets/Extensions/V8/XamElements.xml publish/Extensions/17559/
          cp XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559CustomElements.xml publish/Extensions/17559/
          cp XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559SceneElements.xml publish/Extensions/17559/
          cp XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559ControlPackElements.xml publish/Extensions/17559/
          cp XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559HUDElements.xml publish/Extensions/17559/
          cp XUIHelper/XUIHelper.Core/Assets/Extensions/V8/17559.xhe publish/Extensions/17559/
          chmod +x publish/XUIHelper.CLI

      - name: Smoke test
        shell: bash
        run: ./publish/XUIHelper.CLI about

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: xuihelper-linux-x64-17559
          path: publish/**
          if-no-files-found: error
