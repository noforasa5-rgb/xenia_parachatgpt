          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe "artifact\xenia_canary.exe"
          Copy-Item "src\xenia\ui\imgui_guest_notification.cc" "artifact\imgui_guest_notification.v4.cc"

          $hash = (Get-FileHash "artifact\xenia_canary.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  xenia_canary.exe" | Set-Content "artifact\SHA256.txt" -Encoding ascii

          @"
          Xenia Canary Xbox 360 Achievement Popup V4
          Upstream commit: $env:XENIA_COMMIT
          Patch marker: XBOX360_ORIGINAL_ACHIEVEMENT_V4

          Put these files beside Xenia under:
            xbox360_ui\xenonLogo.png
            xbox360_ui\Achievement.png

          V4 geometry derived from dashboard 2.0.17559.0 skin.xur:
            scr_Notification: 370 x 61
            bgCurve1: 356 x 39, Y=10
            xenonLogo1: 58 x 58, X=3.76876, Y=0.204125
            TextPresenter: 283 x 60, X=59, PointSize=11

          SHA-256: $hash
          "@ | Set-Content "artifact\README_V4.txt" -Encoding ascii

          Write-Host "SHA-256: $hash"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: xenia-canary-achievement-popup-v4-a5a18f5c7
